<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f5f0"/>
      <stop offset="1" stop-color="#f1ede4"/>
    </linearGradient>
    <style>
      text { font-family: "Noto Serif TC", serif; }
      .sub { font-family: "Noto Sans TC", sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 原子軌道裝飾 -->
  <g fill="none" stroke="#d8d2c6" stroke-width="1.2" transform="translate(220 180)">
    <ellipse rx="85" ry="30"/>
    <ellipse rx="85" ry="30" transform="rotate(60)"/>
    <ellipse rx="85" ry="30" transform="rotate(-60)"/>
  </g>

  <!-- 主標題 -->
  <text x="180" y="340" font-size="92" fill="#2c2c2c" font-weight="600">
    physics
  </text>
  <text x="180" y="430" font-size="88" fill="#2c2c2c" font-weight="600">
    long
  </text>

  <!-- 副標題 -->
  <text x="180" y="480" class="sub" font-size="22" fill="#8a8278" font-weight="500" letter-spacing="1.5">
    teacher • designer
  </text>

  <!-- 網站網址 -->
  <text x="880" y="600" class="sub" font-size="26" fill="#a0826d" font-weight="500" text-anchor="end">
    long-ten-alpha.vercel.app
  </text>
</svg>
